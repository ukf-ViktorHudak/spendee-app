    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#121212',
              card: '#1e1e1e',
              success: '#4ade80',
              danger: '#f87171',
              text: '#e2e8f0',
              subtext: '#94a3b8'
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },

      }

    <style>

      body {
        background-color: #121212;
        color: #e2e8f0;
      }

      /* Custom Scrollbar for "Spendee" feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
